packages:
  - example
  - packages/fbtee
  - packages/next-plugin-fbtee
  - packages/fbtee-compiler
  - packages/fbtee-compiler/npm/*
  - packages/vite-plugin-fbtee
  - packages/eslint-plugin-fbtee
  - website

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - vite@8.1.5
  - '@nkzw/oxlint-config@2.0.1'

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver

overrides:
  react-dom@^19: ^19.1.1
  react-is: ^19.1.1
  react@^19: ^19.1.1

updateConfig:
  ignoreDependencies:
    - '@babel/standalone'
    - '@types/prettier'
    - prettier
