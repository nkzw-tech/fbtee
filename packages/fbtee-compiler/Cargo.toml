[package]
name = "oxc-transform-fbtee"
version = "5.0.0"
edition.workspace = true
rust-version = "1.97"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "fbtee"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
glob = "0.3.4"
html-escape = "0.3.1"
indexmap = { version = "2.14.2", features = ["serde"] }
json5 = "1.3.7"
md-5 = "0.11.0"
napi = { version = "3.16.2", features = ["async", "object_indexmap"] }
napi-derive = "3.7.1"
oxc = { version = "0.158.0", features = ["full"] }
oxc_estree = "0.158.0"
oxc_napi = "0.158.0"
oxc_sourcemap = { version = "9.0.0", features = ["napi"] }
pathdiff = "0.2.3"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[build-dependencies]
napi-build = "2.6.0"
